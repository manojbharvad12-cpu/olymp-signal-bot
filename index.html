<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Olymp Smooth Live Tick Scalper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0e14; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    
    .header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid #1a2332; }
    .logo { font-size: 15px; font-weight: 800; color: #00e5ff; }
    .status-badge { font-size: 11px; color: #00ff88; display: flex; align-items: center; gap: 5px; background: rgba(0, 255, 136, 0.1); padding: 4px 8px; border-radius: 12px; }
    .pulse-dot { width: 7px; height: 7px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

    .timer-bar { width: 100%; margin-top: 8px; background: #121926; border: 1px solid #1f2b3e; border-radius: 8px; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .timer-sec { font-size: 14px; font-weight: 800; color: #00e5ff; }

    .controls { width: 100%; margin-top: 8px; }
    select { background: #141b26; border: 1px solid #243247; color: white; padding: 10px; border-radius: 8px; font-size: 13px; outline: none; width: 100%; font-weight: 600; }

    .chart-container { width: 100%; height: 300px; margin-top: 8px; background: #101622; border: 1px solid #1e293b; border-radius: 10px; overflow: hidden; }
    #tradingview_widget { width: 100%; height: 100%; }

    /* Smooth Live Market Ticker */
    .market-box { width: 100%; margin-top: 10px; background: #101622; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .price-label { font-size: 11px; color: #8fa0b5; }
    .price-val { font-size: 18px; font-weight: 900; color: #fff; margin-top: 2px; transition: color 0.2s ease; }
    .price-up { color: #00ff88 !important; }
    .price-down { color: #ff2a55 !important; }

    .target-val { font-size: 15px; color: #00e5ff; font-weight: 800; margin-top: 2px; }

    .signal-card { width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; text-align: center; display: none; }
    .signal-buy { background: linear-gradient(135deg, rgba(0, 230, 118, 0.2), rgba(0, 200, 83, 0.05)); border: 2px solid #00e676; }
    .signal-sell { background: linear-gradient(135deg, rgba(255, 42, 85, 0.2), rgba(213, 0, 0, 0.05)); border: 2px solid #ff2a55; }
    .signal-wait { background: linear-gradient(135deg, rgba(255, 193, 7, 0.2), rgba(255, 160, 0, 0.05)); border: 2px solid #ffc107; }
    
    .signal-text { font-size: 22px; font-weight: 900; }
    .signal-buy .signal-text { color: #00e676; }
    .signal-sell .signal-text { color: #ff2a55; }
    .signal-wait .signal-text { color: #ffc107; }

    .signal-details { margin-top: 8px; background: rgba(0,0,0,0.4); border-radius: 6px; padding: 8px; font-size: 12px; line-height: 1.5; text-align: left; }
    
    .btn-generate { width: 100%; margin-top: 10px; background: linear-gradient(90deg, #0088cc, #00e5ff); color: #000; font-weight: 800; font-size: 14px; border: none; cursor: pointer; border-radius: 8px; padding: 13px; }
  </style>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

  <div class="header">
    <div class="logo">⚡ SMOOTH TICK SCALPER</div>
    <div class="status-badge"><span class="pulse-dot"></span> LIVE WEBSOCKET</div>
  </div>

  <div class="timer-bar">
    <span>Next Candle In:</span>
    <span class="timer-sec" id="candleTimer">00:00</span>
  </div>

  <div class="controls">
    <select id="assetSelect" onchange="switchAsset()">
      <option value="btcusdt" data-tv="BINANCE:BTCUSDT">Bitcoin (BTC/USDT) - Realtime Stream</option>
      <option value="ethusdt" data-tv="BINANCE:ETHUSDT">Ethereum (ETH/USDT) - Realtime Stream</option>
      <option value="solusdt" data-tv="BINANCE:SOLUSDT">Solana (SOL/USDT) - Realtime Stream</option>
    </select>
  </div>

  <div class="chart-container">
    <div id="tradingview_widget"></div>
  </div>

  <div class="market-box">
    <div>
      <div class="price-label">Live WebSocket Price (Smooth)</div>
      <div class="price-val" id="dispPrice">Loading...</div>
    </div>
    <div style="text-align: right;">
      <div class="price-label">1M Scalp Target</div>
      <div class="target-val" id="dispTarget">---</div>
    </div>
  </div>

  <div class="signal-card" id="signalCard">
    <div class="signal-text" id="signalDecision">UP / CALL 🟢</div>
    <div class="signal-details" id="signalDetails"></div>
  </div>

  <button class="btn-generate" id="btnGen" onclick="calculateInstantSignal()">ANALYZE 1M (LIVE TICK CONFIRM)</button>

  <script>
    let currentSocket = null;
    let liveTickPrice = 0;
    let previousTickPrice = 0;

    // Candle Countdown Timer
    setInterval(() => {
      const now = new Date();
      const sec = 59 - now.getSeconds();
      document.getElementById("candleTimer").innerText = "00:" + (sec < 10 ? "0" + sec : sec);
    }, 1000);

    // Live Candlestick Widget
    let widget;
    function loadChart(symbolName) {
      document.getElementById("tradingview_widget").innerHTML = "";
      widget = new TradingView.widget({
        "autosize": true,
        "symbol": symbolName,
        "interval": "1",
        "timezone": "Asia/Kolkata",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#101622",
        "enable_publishing": false,
        "container_id": "tradingview_widget"
      });
    }

    // Direct WebSocket for Olymp-like smooth price ticking
    function connectLiveWebSocket(symbol) {
      if (currentSocket) {
        currentSocket.close();
      }

      currentSocket = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@trade`);

      currentSocket.onmessage = function (event) {
        const msg = JSON.parse(event.data);
        liveTickPrice = parseFloat(msg.p);

        const priceEl = document.getElementById("dispPrice");
        priceEl.innerText = liveTickPrice.toFixed(2);

        // Smooth Green / Red flash animation on every single tick
        if (liveTickPrice > previousTickPrice) {
          priceEl.className = "price-val price-up";
        } else if (liveTickPrice < previousTickPrice) {
          priceEl.className = "price-val price-down";
        }
        previousTickPrice = liveTickPrice;
      };
    }

    function switchAsset() {
      const sel = document.getElementById("assetSelect");
      const streamSymbol = sel.value;
      const tvSymbol = sel.options[sel.selectedIndex].getAttribute("data-tv");
      
      loadChart(tvSymbol);
      connectLiveWebSocket(streamSymbol);
      document.getElementById("signalCard").style.display = "none";
    }

    window.onload = () => {
      switchAsset();
    };

    async function calculateInstantSignal() {
      const sel = document.getElementById("assetSelect");
      const symbol = sel.value.toUpperCase();
      const card = document.getElementById("signalCard");

      if (liveTickPrice === 0) return;

      try {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=15`);
        const candles = await res.json();

        const opens = candles.map(c => parseFloat(c[1]));
        const highs = candles.map(c => parseFloat(c[2]));
        const lows = candles.map(c => parseFloat(c[3]));
        const closes = candles.map(c => parseFloat(c[4]));

        const currentCandleOpen = opens[opens.length - 1];
        const isGreen = liveTickPrice >= currentCandleOpen;

        // ATR Calculation
        let trSum = 0;
        for (let i = 1; i < candles.length; i++) {
          trSum += Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]));
        }
        const atr = (trSum / (candles.length - 1)) * 0.65;

        let decision = isGreen ? "UP" : "DOWN";
        let target = isGreen ? (liveTickPrice + atr).toFixed(2) : (liveTickPrice - atr).toFixed(2);

        document.getElementById("dispTarget").innerText = target;

        if (decision === "UP") {
          card.className = "signal-card signal-buy";
          document.getElementById("signalDecision").innerText = "UP / CALL 🟢";
        } else {
          card.className = "signal-card signal-sell";
          document.getElementById("signalDecision").innerText = "DOWN / PUT 🔴";
        }

        document.getElementById("signalDetails").innerHTML = `
          <b>Real Live Price:</b> ${liveTickPrice.toFixed(2)}<br>
          <b>1M Scalp Target:</b> ${target}<br>
          <b>Live Momentum:</b> ${isGreen ? "Buyer Tick Pressure (Green)" : "Seller Tick Pressure (Red)"}
        `;
        card.style.display = "block";

      } catch (e) {
        alert("Signal calculation error.");
      }
    }
  </script>
</body>
</html>
