<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Olymp Trade Pro Live Chart & Signal Bot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0e14; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    
    .header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #1a2332; }
    .logo { font-size: 15px; font-weight: 800; color: #00e5ff; }
    .status-badge { font-size: 11px; color: #00ff88; display: flex; align-items: center; gap: 5px; background: rgba(0, 255, 136, 0.1); padding: 4px 8px; border-radius: 12px; }
    .pulse-dot { width: 7px; height: 7px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; }

    .timer-bar { width: 100%; margin-top: 10px; background: #121926; border: 1px solid #1f2b3e; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .timer-sec { font-size: 14px; font-weight: 800; color: #00e5ff; }

    .controls { width: 100%; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    select { background: #141b26; border: 1px solid #243247; color: white; padding: 11px; border-radius: 10px; font-size: 13px; outline: none; width: 100%; font-weight: 600; }

    /* Real-Time Live Chart Styling */
    .chart-container { width: 100%; height: 320px; margin-top: 12px; background: #101622; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; position: relative; }
    #tradingview_widget { width: 100%; height: 100%; }

    .market-box { width: 100%; margin-top: 12px; background: #101622; border: 1px solid #1e293b; border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .price-label { font-size: 11px; color: #8fa0b5; }
    .price-val { font-size: 16px; font-weight: 800; color: #fff; margin-top: 2px; }
    .target-val { font-size: 14px; color: #00e5ff; font-weight: 800; margin-top: 2px; }

    .signal-card { width: 100%; margin-top: 12px; padding: 12px; border-radius: 12px; text-align: center; display: none; }
    .signal-buy { background: linear-gradient(135deg, rgba(0, 230, 118, 0.2), rgba(0, 200, 83, 0.05)); border: 2px solid #00e676; }
    .signal-sell { background: linear-gradient(135deg, rgba(255, 42, 85, 0.2), rgba(213, 0, 0, 0.05)); border: 2px solid #ff2a55; }
    .signal-wait { background: linear-gradient(135deg, rgba(255, 193, 7, 0.2), rgba(255, 160, 0, 0.05)); border: 2px solid #ffc107; }
    
    .signal-text { font-size: 22px; font-weight: 900; }
    .signal-buy .signal-text { color: #00e676; }
    .signal-sell .signal-text { color: #ff2a55; }
    .signal-wait .signal-text { color: #ffc107; }

    .signal-details { margin-top: 8px; background: rgba(0,0,0,0.35); border-radius: 8px; padding: 8px; font-size: 12px; line-height: 1.5; text-align: left; }
    
    .btn-generate { width: 100%; margin-top: 12px; background: linear-gradient(90deg, #0088cc, #00e5ff); color: #000; font-weight: 800; font-size: 14px; border: none; cursor: pointer; border-radius: 10px; padding: 13px; }
    .btn-generate:disabled { opacity: 0.5; }
  </style>
  <!-- TradingView Library -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

  <div class="header">
    <div class="logo">⚡ LIVE CHART & SCALPER</div>
    <div class="status-badge"><span class="pulse-dot"></span> REALTIME</div>
  </div>

  <div class="timer-bar">
    <span>Next Candle In:</span>
    <span class="timer-sec" id="candleTimer">00:00</span>
  </div>

  <div class="controls">
    <select id="assetSelect" onchange="updateChart()">
      <option value="BINANCE:BTCUSDT" data-symbol="BTCUSDT">Bitcoin (BTC/USDT) - Realtime Chart</option>
      <option value="BINANCE:ETHUSDT" data-symbol="ETHUSDT">Ethereum (ETH/USDT) - Realtime Chart</option>
      <option value="BINANCE:SOLUSDT" data-symbol="SOLUSDT">Solana (SOL/USDT) - Realtime Chart</option>
      <option value="FX:EURUSD" data-symbol="EURUSD">EUR/USD - Real Forex</option>
      <option value="TVC:GOLD" data-symbol="GOLD">Gold (XAU/USD)</option>
    </select>
  </div>

  <!-- Realtime Candlestick Chart Window -->
  <div class="chart-container">
    <div id="tradingview_widget"></div>
  </div>

  <div class="market-box">
    <div>
      <div class="price-label">Live Market Level</div>
      <div class="price-val" id="dispPrice">---</div>
    </div>
    <div style="text-align: right;">
      <div class="price-label">Predicted 1M Target</div>
      <div class="target-val" id="dispTarget">---</div>
    </div>
  </div>

  <div class="signal-card" id="signalCard">
    <div class="signal-text" id="signalDecision">DOWN / PUT 🔴</div>
    <div class="signal-details" id="signalDetails">
      Target: <b>---</b><br>
      Reason: 1-minute candle scalp target calculation.
    </div>
  </div>

  <button class="btn-generate" id="btnGen" onclick="runAnalysis()">ANALYZE 1M ON LIVE CHART</button>

  <script>
    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    // Candle Countdown Timer
    setInterval(() => {
      const now = new Date();
      const sec = 59 - now.getSeconds();
      document.getElementById("candleTimer").innerText = "00:" + (sec < 10 ? "0" + sec : sec);
    }, 1000);

    // Live Candlestick Widget Loader
    let widget;
    function loadChart(symbolName) {
      document.getElementById("tradingview_widget").innerHTML = "";
      widget = new TradingView.widget({
        "autosize": true,
        "symbol": symbolName,
        "interval": "1",
        "timezone": "Asia/Kolkata",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#101622",
        "enable_publishing": false,
        "hide_top_toolbar": false,
        "hide_legend": false,
        "save_image": false,
        "container_id": "tradingview_widget"
      });
    }

    function updateChart() {
      const symbol = document.getElementById("assetSelect").value;
      loadChart(symbol);
      document.getElementById("signalCard").style.display = "none";
    }

    // Default Load with Bitcoin
    window.onload = () => {
      loadChart("BINANCE:BTCUSDT");
    };

    async function runAnalysis() {
      const selectElem = document.getElementById("assetSelect");
      const selectedOption = selectElem.options[selectElem.selectedIndex];
      const apiSymbol = selectedOption.getAttribute("data-symbol");
      const btn = document.getElementById("btnGen");
      const card = document.getElementById("signalCard");

      btn.disabled = true;
      card.style.display = "none";

      let currentPrice = 0;
      let targetPrice = 0;
      let decision = "WAIT";
      let reason = "";

      try {
        let candles = [];
        if (apiSymbol.includes("USDT")) {
          const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${apiSymbol}&interval=1m&limit=20`);
          candles = await res.json();
        } else {
          const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=20`);
          candles = await res.json();
        }
        await sleep(400);

        const closes = candles.map(c => parseFloat(c[4]));
        const opens = candles.map(c => parseFloat(c[1]));
        const highs = candles.map(c => parseFloat(c[2]));
        const lows = candles.map(c => parseFloat(c[3]));

        currentPrice = closes[closes.length - 1];

        // 1-Minute ATR calculation
        let trSum = 0;
        for (let i = candles.length - 14; i < candles.length; i++) {
          const tr = Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]), Math.abs(lows[i] - closes[i - 1]));
          trSum += tr;
        }
        const atr1m = trSum / 14;

        const lastOpen = opens[opens.length - 1];
        const lastClose = closes[closes.length - 1];
        const isGreen = lastClose >= lastOpen;
        const bodySize = Math.abs(lastClose - lastOpen);
        const candleRange = highs[highs.length - 1] - lows[lows.length - 1];
        const scalpBuffer = parseFloat((atr1m * 0.65).toFixed(2));

        if (isGreen && bodySize > candleRange * 0.45) {
          decision = "UP";
          targetPrice = (currentPrice + scalpBuffer).toFixed(2);
          reason = `Bullish Candle Momentum: Target +${scalpBuffer} level hit thashe.`;
        } else if (!isGreen && bodySize > candleRange * 0.45) {
          decision = "DOWN";
          targetPrice = (currentPrice - scalpBuffer).toFixed(2);
          reason = `Bearish Candle Pressure: Target -${scalpBuffer} level hit thashe.`;
        } else {
          decision = "WAIT";
          targetPrice = currentPrice.toFixed(2);
          reason = `Sideways Doji / Long wick rejection: Next 1 min risk chhe, trade avoid karo.`;
        }

        document.getElementById("dispPrice").innerText = currentPrice.toFixed(2);
        document.getElementById("dispTarget").innerText = targetPrice;

        if (decision === "UP") {
          card.className = "signal-card signal-buy";
          document.getElementById("signalDecision").innerText = "UP / CALL 🟢";
        } else if (decision === "DOWN") {
          card.className = "signal-card signal-sell";
          document.getElementById("signalDecision").innerText = "DOWN / PUT 🔴";
        } else {
          card.className = "signal-card signal-wait";
          document.getElementById("signalDecision").innerText = "WAIT / NO TRADE ⚠️";
        }

        document.getElementById("signalDetails").innerHTML = `
          Estimated 1M Target: <b>${targetPrice}</b><br>
          Reason: ${reason}
        `;
        card.style.display = "block";

      } catch (err) {
        alert("Live candle data fetch thavama issue aavyo. Fari try karo.");
      }

      btn.disabled = false;
    }
  </script>
</body>
</html>
